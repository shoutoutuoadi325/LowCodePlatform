server:
  port: 8081

spring:
  application:
    name: device-service
  
  # Azure SQL Server 数据源配置
  datasource:
    url: jdbc:sqlserver://${DB_HOST:shoutoutuoadi325.database.windows.net}:${DB_PORT:1433};databaseName=${DB_NAME:devicedb};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
    username: ${DB_USERNAME:shoutoutuoadi325}
    password: ${DB_PASSWORD:1QAZ0plm@}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    
    # HikariCP 连接池配置
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      pool-name: DeviceServiceHikariCP
      
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        
  # SQL Server 特定配置
  sql:
    init:
      mode: always
      continue-on-error: true

# MQTT 配置
mqtt:
  broker:
    url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client:
    id: device-service-${random.uuid}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}

# 服务发现配置
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# 日志配置
logging:
  level:
    com.xiyuan.iot: INFO
    org.springframework.integration: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.microsoft.sqlserver: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
