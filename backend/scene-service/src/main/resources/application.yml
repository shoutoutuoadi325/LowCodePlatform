server:
  port: 8082

spring:
  application:
    name: scene-service
  datasource:
    url: jdbc:h2:file:./data/scenedb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

device:
  service:
    url: http://localhost:8081

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.xiyuan.iot: DEBUG
