server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: device-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/devices/**
          filters:
            - StripPrefix=0
        - id: scene-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/scenes/**
          filters:
            - StripPrefix=0
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
