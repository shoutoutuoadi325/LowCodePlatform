version: '3.8'

services:
  device-service:
    build: 
      context: ./backend/device-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - iot-network
    restart: unless-stopped
    
  scene-service:
    build: 
      context: ./backend/scene-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DEVICE_SERVICE_URL=http://device-service:8081
    depends_on:
      - device-service
    networks:
      - iot-network
    restart: unless-stopped
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - device-service
      - scene-service
    networks:
      - iot-network
    restart: unless-stopped

networks:
  iot-network:
    driver: bridge
