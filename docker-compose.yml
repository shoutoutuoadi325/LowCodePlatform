services:
  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iot-network
    restart: unless-stopped
    
  device-service:
    build: 
      context: ./backend/device-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MQTT_BROKER_URL=tcp://mosquitto:1883
    depends_on:
      - mosquitto
    networks:
      - iot-network
    restart: unless-stopped
    
  scene-service:
    build: 
      context: ./backend/scene-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DEVICE_SERVICE_URL=http://device-service:8081
    depends_on:
      - device-service
    networks:
      - iot-network
    restart: unless-stopped
  
  # 设备模拟器
  device-simulator:
    build:
      context: ./device-simulator
      dockerfile: Dockerfile
    environment:
      - MQTT_BROKER_URL=tcp://mosquitto:1883
    depends_on:
      - mosquitto
      - device-service
    networks:
      - iot-network
    restart: unless-stopped
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - device-service
      - scene-service
    networks:
      - iot-network
    restart: unless-stopped

networks:
  iot-network:
    driver: bridge
